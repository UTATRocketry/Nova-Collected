name: PR checks

on:
  pull_request:
    # `edited` so fixing the PR title re-runs the checks.
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Branch names, PR direction and PR title. This repo uses GitHub Flow:
  # short-lived branches straight into main (CONTRIBUTING.md section 10).
  rules:
    name: rules
    runs-on: ubuntu-latest
    steps:
      - name: Branch name and target
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          words='[a-z0-9]+(-[a-z0-9]+)*'
          work="^(feature|bugfix|chore|tests)/${words}$"
          hotfix="^hotfix/${words}$"
          release='^release/v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$'
          github_made='^(revert-[0-9]+-|dependabot/)'
          if [[ ! ( "$HEAD_REF" =~ $work || "$HEAD_REF" =~ $hotfix || "$HEAD_REF" =~ $github_made ) ]]; then
            echo "::error::Branch '$HEAD_REF' must be named feature/..., bugfix/..., chore/... or tests/... (lower case, words joined by single hyphens), e.g. chore/runbook-typos. Rename it on GitHub (Branches page, pencil icon) - that keeps this PR."
            exit 1
          fi
          if [[ "$BASE_REF" != "main" ]]; then
            echo "::error::This repo uses GitHub Flow: PRs go into main, not '$BASE_REF'."
            exit 1
          fi
          echo "Branch '$HEAD_REF' -> main is fine."

      - name: PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          conventional='^(feat|fix|refactor|docs|test|chore)(\([a-z0-9._/-]+\))?!?: .{3,}$'
          github_revert='^Revert "'
          if [[ ! "$TITLE" =~ $conventional && ! "$TITLE" =~ $github_revert ]]; then
            echo "::error::PR title '$TITLE' must look like 'fix(fas): reopen the COM port after unplug' - type(optional scope): what changed. Edit the title; the checks re-run by themselves."
            exit 1
          fi
          if (( ${#TITLE} > 72 )); then
            echo "::error::PR title is ${#TITLE} characters; keep it to 72 or fewer."
            exit 1
          fi
          echo "Title is fine."

  # Only `Nova.ps1` may move a submodule or write releases/; a PR that does
  # would fight the ground station's release history (CONTRIBUTING.md).
  nova:
    name: nova
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false

      - name: Pins and releases are untouched
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          bad=$(printf '%s\n' "$changed" | grep -E '^(prod/|pi/|firmware$|releases/|\.gitmodules$)' || true)
          if [[ -n "$bad" ]]; then
            echo "::error::This PR changes files only Nova.ps1 may change:"
            printf '  %s\n' $bad
            echo "::error::Remove those changes from the PR. Code reaches a release by being tested and pinned on the ground station, not by bumping submodules."
            exit 1
          fi
          echo "No pins or releases touched."

      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem -Recurse -Path ops -Filter *.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            foreach ($e in $errors) { Write-Host "::error file=$($f.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }
          Write-Host "All ops scripts parse."

      - name: Console compiles
        run: python3 -m py_compile ops/console/nova_console.py
